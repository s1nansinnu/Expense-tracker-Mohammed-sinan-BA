<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Transaction - Expense Tracker</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('expenseTracker.theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
  <link rel="stylesheet" href="css/styles.css" />
  <script defer src="js/storage.js"></script>
  <script defer src="js/validation.js"></script>
  <script defer src="js/core.js"></script>
  <script defer src="js/add.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <div id="debtBanner" hidden></div>
      <header class="topbar" id="topbar"></header>

      <main class="content">
        <section class="panel form-panel">
          <div class="panel-head">
            <div>
              <h2 class="panel-title" id="formTitle">New Transaction</h2>
              <p class="panel-sub">Fields marked * are required</p>
            </div>
          </div>

          <form id="txForm" novalidate autocomplete="off">
            <div class="type-toggle" role="radiogroup" aria-label="Transaction type">
              <input type="radio" name="type" id="typeExpense" value="expense" checked />
              <label for="typeExpense" class="toggle-expense">Expense</label>
              <input type="radio" name="type" id="typeIncome" value="income" />
              <label for="typeIncome" class="toggle-income">Income</label>
            </div>

            <div class="field-row">
              <div class="field">
                <label for="amount">Amount (₹) *</label>
                <input id="amount" name="amount" type="text" inputmode="decimal" placeholder="0.00" aria-describedby="amountError" />
                <small class="error" id="amountError" aria-live="polite"></small>
              </div>
              <div class="field">
                <label for="date">Date *</label>
                <input id="date" name="date" type="date" aria-describedby="dateError" />
                <small class="error" id="dateError" aria-live="polite"></small>
              </div>
            </div>

            <div class="field">
              <label for="category">Category *</label>
              <select id="category" name="category" aria-describedby="categoryError"></select>
              <small class="error" id="categoryError" aria-live="polite"></small>
            </div>

            <div class="field">
              <label for="description" id="descriptionLabel">Description *</label>
              <input id="description" name="description" type="text" maxlength="60" placeholder="e.g. Groceries at the market" aria-describedby="descriptionError" />
              <small class="error" id="descriptionError" aria-live="polite"></small>
            </div>

            <fieldset id="debtFields" class="debt-fields" hidden>
              <legend id="debtLegend">Borrowed money details</legend>
              <div class="field">
                <label for="lender" id="lenderLabel">Borrowed from *</label>
                <input id="lender" name="lender" type="text" maxlength="40" placeholder="Person's name" aria-describedby="lenderError" />
                <small class="error" id="lenderError" aria-live="polite"></small>
              </div>
              <div class="field">
                <label for="repayDays" id="repayDaysLabel">Pay back within (days) *</label>
                <div class="chips" id="repayChips">
                  <button type="button" class="chip" data-days="7">7 days</button>
                  <button type="button" class="chip" data-days="15">15 days</button>
                  <button type="button" class="chip" data-days="20">20 days</button>
                  <button type="button" class="chip" data-days="30">30 days</button>
                </div>
                <input id="repayDays" name="repayDays" type="number" min="1" max="3650" step="1" placeholder="Or enter number of days" aria-describedby="repayDaysError" />
                <small class="error" id="repayDaysError" aria-live="polite"></small>
                <p class="due-preview" id="duePreview"></p>
              </div>
              <label class="checkbox">
                <input type="checkbox" id="repaid" name="repaid" /> <span id="repaidLabel">Already repaid</span>
              </label>
            </fieldset>

            <div class="form-actions">
              <button type="submit" id="submitBtn" class="btn btn-primary">Save Transaction</button>
              <a href="transactions.html" id="cancelBtn" class="btn btn-ghost">Cancel</a>
            </div>
          </form>
        </section>
      </main>
    </div>
  </div>
  <nav class="bottom-nav" id="bottomNav" aria-label="Main"></nav>
</body>
</html>
